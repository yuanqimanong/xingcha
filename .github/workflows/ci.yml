# 星槎 CI。
#
# 这个文件的存在本身是一条修复：README 与开发计划里三处写着「任何改动闭集的提交都会
# 让 CI 变红」、「CI 里有一条特别的断言：在 ALL_PROXY 指向黑洞的环境下跑全套测试」，
# 而仓库里**从来没有过 CI**。冻结物只在有人手动跑 pytest 时才生效——那不是约束，
# 是约定。
#
# 四件事按"越便宜越先"排，任一失败就停：
#   1. lint + 类型     秒级，先挡掉低级错误
#   2. 契约冻结物      单独一步跑，红的时候一眼看出是契约变更而不是普通失败
#   3. 全套测试        含黑洞代理那一遍（E1）
#   4. 镜像可构建      A12/A13：装坏了的镜像必须在这里红，而不是在 VPS 上

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支的新推送取消旧的跑批。省 runner，也避免看到过期的红绿。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true

      - name: 装依赖
        # --frozen：按锁文件装，与镜像构建同一套（A12）。锁文件与 pyproject 不一致
        # 时这里就会失败，而不是等到部署时才发现两边装出不同的传递依赖。
        run: uv sync --frozen

      - name: lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: 类型
        run: uv run pyright

      - name: 契约冻结物
        # 单独一步：红在这里就是"你改了一个冻结的闭集"，不是普通的测试失败。
        # 这一步的存在是 M0「产出是约束本身」的唯一执行机制。
        run: uv run pytest tests/test_contract_frozen.py tests/test_layering.py -q

      - name: CONTRACT.md 与常量同步
        # 文档由常量生成，不手写。漂移了就说明有人手改了文档、或改了常量没重新生成。
        run: |
          uv run python -m xingcha.contract_doc
          git diff --exit-code -- docs/CONTRACT.md

      - name: 全套测试（不含浏览器）
        run: uv run pytest -q -m "not browser"

      - name: 全套测试（代理指黑洞）
        # E1：httpx2 默认 trust_env=True，会读机器的 ALL_PROXY。所有自建 client
        # 必须显式 trust_env=False，否则线上会因为一个环境变量而整体起不来，
        # 且报错完全看不出跟代理有关。
        #
        # socks5 下 socksio 未装会在**构造阶段**就 ImportError，所以这一遍绿是有
        # 含金量的：它证明没有任何客户端在读环境代理。
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: socks5://127.0.0.1:9
        run: uv run pytest -q -m "not slow and not browser"

  browser:
    # 浏览器端到端。单独一个 job：它比其余测试慢一个数量级，而且失败原因与单元层
    # 完全不同——混在一起的话"红了"这件事本身失去信息量。
    #
    # 它是唯一能证明"页面在浏览器里真能用"的一层。CSP 挡掉内联脚本那次，ASGI 层的
    # 全套测试是绿的，而复制密钥按钮无反应、危险操作的二次确认根本不弹。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true

      - name: 装依赖
        run: uv sync --frozen

      - name: 装 chromium
        # 用系统的 chromium 而不是 playwright 自带的：本机开发与 CI 用同一个二进制，
        # 也省掉一次几百 MB 的下载。测试里的路径是 /usr/bin/chromium。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium
          chromium --version

      - name: 浏览器端到端
        run: uv run pytest -q -m browser

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        # Dockerfile 里有构建期自检（xingcha --help + import）。A13 那次就是这样
        # 被发现的：uv sync 默认装 editable，构建绿灯而镜像里 import 直接失败。
        run: docker build -t xingcha:ci .

      - name: 镜像自检
        # 镜像里没有 pytest（--no-dev），所以这里不是跑测试，而是验"这个镜像真的能用"。
        # A13 那次就是没做这件事：构建绿灯、275MB 镜像跑任何命令都 ModuleNotFoundError。
        # （编排的结构约束由 check job 里的 tests/test_deploy_artifacts.py 覆盖。）
        run: |
          docker run --rm xingcha:ci --help >/dev/null
          docker run --rm --entrypoint python xingcha:ci -c "import xingcha, opentelemetry.sdk"
          docker run --rm --entrypoint sh -e XINGCHA_DATA_DIR=/tmp/d xingcha:ci -c '
            set -e
            xingcha db upgrade
            xingcha config set openrouter.api_key sk-or-v1-ci
            xingcha db backup
            xingcha db verify
          '

      - name: 镜像里的静态资源齐不齐
        # 模板引用的每个 static 文件都必须**在镜像里**存在。
        #
        # 源码树里的测试（tests/test_admin.py::test_every_script_src_is_served_by_us）
        # 查的是源码，查不到打包这一层。实测踩过：新加的 web/static/app.js 没进旧
        # 镜像，容器里 /admin/static/app.js 是 404 —— 而复制按钮与危险操作的二次
        # 确认全靠它，页面看起来正常、点了没反应。
        #
        # 模板里的写法是 `{{ asset('app.js') }}`（asset 会附上内容哈希做缓存版本），
        # 所以这里从 asset(...) 里取名字，而不是从 src="..." 里取。
        run: |
          names=$(grep -rhoP "asset\('\K[^']+" src/xingcha/web/templates/ | sort -u)
          test -n "$names" || { echo "::error::一个 asset() 引用都没找到，检查这条断言本身"; exit 1; }
          for f in $names; do
            docker run --rm --entrypoint sh xingcha:ci -c \
              "test -f /opt/venv/lib/python3.13/site-packages/xingcha/web/static/$f" \
              || { echo "::error::模板引用了 static/$f，但镜像里没有"; exit 1; }
            echo "  static/$f ok"
          done
          test -f src/xingcha/web/static/style.css

      - name: compose 配置合法，且默认只绑回环
        # 默认值是一条**安全属性**，不是风格：映射出去的端口走 Docker 的
        # DOCKER-USER 链，会绕过 ufw。所以"开给局域网"必须是 .env 里的一次显式
        # 选择（XINGCHA_BIND_ADDR=0.0.0.0），装上就默认对外是不可接受的。
        run: |
          : > .env
          docker compose -f deploy/docker-compose.yml --env-file .env config > /tmp/cfg.yml
          grep -q '127.0.0.1:8720:8720' /tmp/cfg.yml \
            || { echo "::error::默认没有绑在回环上"; cat /tmp/cfg.yml; exit 1; }
          # 显式开给局域网时才应该出现 0.0.0.0
          printf 'XINGCHA_BIND_ADDR=0.0.0.0\n' > .env
          docker compose -f deploy/docker-compose.yml --env-file .env config \
            | grep -q '0.0.0.0:8720:8720' \
            || { echo "::error::XINGCHA_BIND_ADDR 没起作用"; exit 1; }

      - name: 整栈真的起得来
        # 不只是"配置合法"。此前两个 blocker 都只在真 up 时才暴露；现在虽然只剩
        # 一个容器，data/ 属主不对导致 PermissionError 那条依然在。
        run: |
          : > .env
          mkdir -p data
          # chmod 必须在 chown **之前**：换过属主之后 runner 用户就不是 owner 了，
          # 再 chmod 直接 Operation not permitted。这一步此前是 CI 唯一的红点。
          chmod 700 data
          sudo chown -R 10001:10001 data
          docker compose -f deploy/docker-compose.yml --env-file .env up -d
          for i in $(seq 1 45); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' xingcha-xingcha-1 2>/dev/null)" = healthy ] && break
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml --env-file .env ps
          test "$(docker inspect --format '{{.State.Health.Status}}' xingcha-xingcha-1)" = healthy
          curl -fsS http://127.0.0.1:8720/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8720/version | grep -q '"contract"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8720/v1/models)" = 401
          # 根路径跳后台
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8720/)" = 307
          # 纯 HTTP 下 cookie **不能**带 Secure，否则浏览器丢掉它、用户永远登不进去
          curl -s -D- -o /dev/null http://127.0.0.1:8720/admin/login | grep -i '^set-cookie' \
            | grep -qi 'secure' && { echo "::error::HTTP 下 cookie 带了 Secure"; exit 1; }
          echo "  cookie 未带 Secure ok"

      - name: 收尾
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file .env down -v || true
