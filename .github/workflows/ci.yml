# 星槎 CI。
#
# 这个文件的存在本身是一条修复：README 与开发计划里三处写着「任何改动闭集的提交都会
# 让 CI 变红」、「CI 里有一条特别的断言：在 ALL_PROXY 指向黑洞的环境下跑全套测试」，
# 而仓库里**从来没有过 CI**。冻结物只在有人手动跑 pytest 时才生效——那不是约束，
# 是约定。
#
# 四件事按"越便宜越先"排，任一失败就停：
#   1. lint + 类型     秒级，先挡掉低级错误
#   2. 契约冻结物      单独一步跑，红的时候一眼看出是契约变更而不是普通失败
#   3. 全套测试        含黑洞代理那一遍（E1）
#   4. 镜像可构建      A12/A13：装坏了的镜像必须在这里红，而不是在 VPS 上

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支的新推送取消旧的跑批。省 runner，也避免看到过期的红绿。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true

      - name: 装依赖
        # --frozen：按锁文件装，与镜像构建同一套（A12）。锁文件与 pyproject 不一致
        # 时这里就会失败，而不是等到部署时才发现两边装出不同的传递依赖。
        run: uv sync --frozen

      - name: lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: 类型
        run: uv run pyright

      - name: 契约冻结物与分层
        # 单独一步：红在这里就是"你改了一个冻结的闭集"，不是普通的测试失败。
        # 这一步的存在是 M0「产出是约束本身」的唯一执行机制。
        run: uv run pytest tests/test_contract_frozen.py tests/test_layering.py -q

      - name: 部署产物一致性
        # 端口、UID、BOM 这些散在 Caddyfile / compose / sh / ps1 里的数字与属性，
        # 没有任何语言机制能让它们保持相等。漂移的症状都是"服务好着，只是地址打不开"。
        run: uv run pytest tests/test_deploy_artifacts.py -q

      - name: README 的「对外契约」与常量同步
        # 那一节由常量生成，不手写。漂移了就说明有人手改了文档、或改了常量没重新生成。
        run: |
          uv run python -m xingcha.contract.doc
          git diff --exit-code -- README.md

      - name: 全套测试
        run: uv run pytest -q

      # ══════════════════════════════════════════════════════════════════════
      # 「代理指黑洞」这一步**仍然停用**，而且不能靠现在这批测试恢复。
      #
      # E1：httpx2 默认 trust_env=True，会读机器的 ALL_PROXY。所有自建 client 必须
      # 显式 trust_env=False，否则线上会因为一个环境变量而整体起不来，且报错完全看
      # 不出跟代理有关。socks5 下 socksio 未装会在**构造阶段**就 ImportError——所以
      # 那一遍绿是有含金量的：它证明没有任何客户端在读环境代理。
      #
      # 但当前恢复的三份测试是纯静态的（解析文件、比对常量），**一个 HTTP client 都
      # 不构造**。现在把它打开只会得到一盏免费的绿灯，比没有这一步更糟。
      # 等直通 / 上游客户端的运行时测试回来之后再恢复：
      #
      #   env:
      #     HTTP_PROXY: http://127.0.0.1:9
      #     HTTPS_PROXY: http://127.0.0.1:9
      #     ALL_PROXY: socks5://127.0.0.1:9
      #   run: uv run pytest -q -m "not slow"
      # ══════════════════════════════════════════════════════════════════════

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        # Dockerfile 里有构建期自检（xingcha --help + import）。A13 那次就是这样
        # 被发现的：uv sync 默认装 editable，构建绿灯而镜像里 import 直接失败。
        run: docker build -t xingcha:ci .

      - name: 镜像自检
        # 镜像里没有 pytest（--no-dev），所以这里不是跑测试，而是验"这个镜像真的能用"。
        # A13 那次就是没做这件事：构建绿灯、275MB 镜像跑任何命令都 ModuleNotFoundError。
        # （编排的结构约束由 check job 里的 tests/test_deploy_artifacts.py 覆盖。）
        run: |
          docker run --rm xingcha:ci --help >/dev/null
          docker run --rm --entrypoint python xingcha:ci -c "import xingcha, opentelemetry.sdk"
          docker run --rm --entrypoint sh -e XINGCHA_DATA_DIR=/tmp/d xingcha:ci -c '
            set -e
            xingcha db upgrade
            xingcha config set openrouter.api_key sk-or-v1-ci
            xingcha db backup
            xingcha db verify
          '

      - name: 镜像里的静态资源齐不齐
        # 模板引用的每个 static 文件都必须**在镜像里**存在。
        #
        # 源码树里的测试（tests/test_admin.py::test_every_script_src_is_served_by_us）
        # 查的是源码，查不到打包这一层。实测踩过：新加的 web/static/app.js 没进旧
        # 镜像，容器里 /admin/static/app.js 是 404 —— 而复制按钮与危险操作的二次
        # 确认全靠它，页面看起来正常、点了没反应。
        #
        # 模板里的写法是 `{{ asset('app.js') }}`（asset 会附上内容哈希做缓存版本），
        # 所以这里从 asset(...) 里取名字，而不是从 src="..." 里取。
        run: |
          names=$(grep -rhoP "asset\('\K[^']+" src/xingcha/web/templates/ | sort -u)
          test -n "$names" || { echo "::error::一个 asset() 引用都没找到，检查这条断言本身"; exit 1; }
          for f in $names; do
            docker run --rm --entrypoint sh xingcha:ci -c \
              "test -f /opt/venv/lib/python3.13/site-packages/xingcha/web/static/$f" \
              || { echo "::error::模板引用了 static/$f，但镜像里没有"; exit 1; }
            echo "  static/$f ok"
          done
          test -f src/xingcha/web/static/style.css

      - name: compose 配置合法，且端口只绑回环
        # **只绑 127.0.0.1 是一条安全属性。** 绑到 0.0.0.0 的话那个端口走 Docker 的
        # DOCKER-USER 链、绕过 ufw，而它那一头是明文 HTTP——于是 TLS 旁边多出一条谁
        # 都能连的入口，而两条并存时人只会记住能打开的那一个。
        #
        # 网关（deploy/edge 的 Caddy 单文件）是**宿主进程**，不在编排里，所以这一步
        # 不需要它在场：验的是"容器这一侧把自己关在回环上"。
        run: |
          printf 'XINGCHA_GATEWAY=edge\n' > .env
          docker compose -f deploy/linux/docker-compose.yml \
            -f deploy/linux/docker-compose.gateway.yml --env-file .env config > /tmp/cfg.yml
          grep -q 'host_ip: 127.0.0.1' /tmp/cfg.yml \
            || { echo "::error::端口没绑在回环上"; cat /tmp/cfg.yml; exit 1; }
          grep -q 'host_ip: 0.0.0.0' /tmp/cfg.yml \
            && { echo "::error::端口绑到了 0.0.0.0"; cat /tmp/cfg.yml; exit 1; }
          echo "  端口只绑 127.0.0.1 ok"

      - name: 整栈真的起得来
        # 探测从**容器内部**做（镜像里有 curl，healthcheck 用的就是它）：宿主那一侧
        # 只绑回环，而 runner 上没有网关。这一步的意义不变：此前两个 blocker 都只在
        # 真 up 时才暴露。
        run: |
          printf 'XINGCHA_GATEWAY=edge\n' > .env
          mkdir -p data
          # chmod 必须在 chown **之前**：换过属主之后 runner 用户就不是 owner 了，
          # 再 chmod 直接 Operation not permitted。这一步曾是 CI 唯一的红点。
          chmod 700 data
          sudo chown -R 10001:10001 data
          DC="docker compose -f deploy/linux/docker-compose.yml -f deploy/linux/docker-compose.gateway.yml --env-file .env"
          $DC up -d
          for i in $(seq 1 45); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' xingcha-xingcha-1 2>/dev/null)" = healthy ] && break
            sleep 2
          done
          $DC ps
          test "$(docker inspect --format '{{.State.Health.Status}}' xingcha-xingcha-1)" = healthy
          docker port xingcha-xingcha-1
          docker port xingcha-xingcha-1 | grep -q '127.0.0.1:' \
            || { echo "::error::端口没绑在回环上"; exit 1; }
          docker port xingcha-xingcha-1 | grep -q '0.0.0.0:' \
            && { echo "::error::端口绑到了 0.0.0.0"; exit 1; }

          x() { docker exec xingcha-xingcha-1 curl -sS "$@"; }
          x http://127.0.0.1:8720/healthz | grep -q '"status":"ok"'
          x http://127.0.0.1:8720/version | grep -q '"contract"'
          test "$(x -o /dev/null -w '%{http_code}' http://127.0.0.1:8720/v1/models)" = 401
          test "$(x -o /dev/null -w '%{http_code}' http://127.0.0.1:8720/)" = 307

          # **反代那条链路的关键断言。**
          #
          # 网关到应用这一跳是 http，所以应用自己看到的 scheme 是 http。要让会话
          # cookie 带上 Secure，必须信任网关发来的 X-Forwarded-Proto —— 而这里
          # 直接用那个头模拟网关，不需要真起一个 Caddy（它不属于这个仓库）。
          #
          # 两个方向都要断言，因为两边错的症状都是"看起来完全正常"：
          #   · 该带没带 → HTTPS 那半段少一层保护，没人会注意到；
          #   · 不该带却带了 → 纯 http 时浏览器直接丢掉 cookie，"密码输对却一直
          #     跳回登录页"，而服务端日志显示登录成功。
          x -D- -o /dev/null -H 'X-Forwarded-Proto: https' http://127.0.0.1:8720/admin/login \
            | grep -i '^set-cookie' | grep -qi 'secure' \
            || { echo "::error::带 X-Forwarded-Proto: https 时 cookie 没有 Secure"; exit 1; }
          x -D- -o /dev/null http://127.0.0.1:8720/admin/login \
            | grep -i '^set-cookie' | grep -qi 'secure' \
            && { echo "::error::纯 http 时 cookie 竟然带了 Secure"; exit 1; }
          echo "  cookie 的 Secure 跟随 X-Forwarded-Proto ok"

      - name: 收尾
        if: always()
        run: |
          docker compose -f deploy/linux/docker-compose.yml --env-file .env down -v --remove-orphans || true
