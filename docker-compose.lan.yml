# 局域网 / 本机测试用的叠加层。
#
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d
#
# 它把生产编排里三处"必须有真域名"的硬要求放松掉，其余（容器形状、卷、日志上限、
# 健康检查、xingcha 零宿主端口）完全沿用生产那一份——测的就是要上线的那套东西。
#
# 为什么需要这一层：生产的 Caddyfile 走 ACME，而局域网 IP 与 localhost 拿不到公网
# 证书。此前这个场景只能手搓 `docker run`，结果是照文档敲的 `docker compose
# restart` 会失败——正规路径不覆盖真实用法，那就是文档在骗人。

services:
  xingcha:
    environment:
      # 覆盖生产那条 `${XINGCHA_DOMAIN:?...}`：局域网没有域名，给个默认值。
      XINGCHA_PUBLIC_URL: https://${XINGCHA_LAN_HOST:-localhost}:${XINGCHA_LAN_PORT:-8443}

    # 把整个 .env 注入容器。
    #
    # **这是「上游可切换」那个功能在 Docker 下能用的前提**：容器不继承宿主环境
    # （Docker 的隔离语义），所以 DEEPSEEK_API_KEY 一类不透传进来就扫不到，
    # 后台的「环境里扫到的」那一栏会是空的。
    #
    # 也顺带带进 XINGCHA_ADMIN_PASSWORD。注意这些值会出现在 `docker inspect`
    # 与 `/proc/<pid>/environ` 里——那是把凭据放进环境变量的固有代价。
    env_file:
      - path: .env
        required: false

  caddy:
    # 生产那份要 ACME_EMAIL（Caddyfile 里 `email {$ACME_EMAIL}` 零参数会让它起不来）。
    # 内部 CA 不签发公网证书，不需要联系邮箱。
    environment:
      XINGCHA_DOMAIN: ${XINGCHA_LAN_HOST:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-none@localhost}
      ACME_CA: ${ACME_CA:-https://acme-staging-v02.api.letsencrypt.org/directory}
      XINGCHA_LAN_HOST: ${XINGCHA_LAN_HOST:-localhost}
      XINGCHA_LAN_PORT: ${XINGCHA_LAN_PORT:-8443}
    # `!override` 而不是让它合并：compose 对 volumes / ports 这类列表默认是**追加**，
    # 于是生产那份的 80/443 会继续被占——本机很可能已经有别的东西在用它们，
    # 而"我明明只想开 8443"却把 443 占掉是一个说不清的副作用。
    volumes: !override
      - ./deploy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
      # 卷也要换名字：内部 CA 与 ACME 的状态混在同一个卷里，切换模式时会带着
      # 上一次的配置，表现为"端口上没人监听"。
      - caddy_lan_data:/data
      - caddy_lan_config:/config
    ports: !override
      - "${XINGCHA_LAN_PORT:-8443}:${XINGCHA_LAN_PORT:-8443}"

volumes:
  # 与生产的 caddy_data / caddy_config 分开：内部 CA 与 ACME 的证书状态不该混。
  caddy_lan_data:
  caddy_lan_config:
