# 挂到本机那个网关（deploy/edge，Caddy 单文件）后面。**可选的叠加层**，
# 由 .env 里的 XINGCHA_GATEWAY 触发。
#
# 不叠这一层：容器发布的端口就是入口，明文 HTTP。
# 叠上之后：入口是 https://<WEB_HOST>:8443，容器那个端口**只绑 127.0.0.1**
# （由 deploy/linux/xc 的 derive_bind_addr 保证，见那里），只有本机的 Caddy 能连。
#
# 为什么是文件而不是变量：这两项要么全有要么全无——只改一项的后果是安静的
# （PUBLIC_URL 对了而 cookie 少了 Secure，或者反过来 cookie 带了 Secure 而实际
# 走的是 http，"密码输对却一直跳回登录页"）。compose 的 ${} 表达不了"成套出现"。
#
# 网关自己怎么起：deploy/README.md。

services:
  xingcha:
    environment:
      # curl 示例要用**网关**的地址。写成容器自己那个 http 地址的话，用户复制那条
      # 命令拿到别的机器上必然连不上（那个端口只绑在本机回环上），而错误信息指不到
      # "该走网关"。
      #
      # 端口来自网关自己的配置（deploy/edge/Caddyfile 里的 8443），由
      # deploy/linux/xc 导出成 XINGCHA_PUBLIC_PORT——不让用户在 .env 里再写一遍：
      # 写两遍就会不一致，而症状是后台印出一个打不开的地址、服务本身却好着。
      XINGCHA_PUBLIC_URL: https://${XINGCHA_WEB_HOST:-localhost}:${XINGCHA_PUBLIC_PORT:-8443}

      # 信任网关发来的 X-Forwarded-Proto，否则**会话 cookie 不带 Secure**。
      #
      # 网关到这里那一跳是 http（走宿主回环），所以应用自己看到的 scheme 是 http，
      # cookie_secure() 会返回 False——浏览器那半段明明是 HTTPS，却少了一层保护，
      # 而功能完全正常，没人会注意到。
      #
      # 为什么敢写 `*`（信任所有来源）：叠上这一层时宿主端口**只绑 127.0.0.1**，
      # 局域网上根本连不到，唯一能发这个头的就是本机上的那个 Caddy。
      # 不写成具体 IP 是因为它不可知：宿主经发布端口连进来时，容器看到的源地址是
      # docker 网桥的网关（172.x.0.1，随项目网络变），写死必然有一天对不上，
      # 而对不上的症状同样是"cookie 悄悄少了 Secure"。
      XINGCHA_TRUSTED_PROXIES: "*"
