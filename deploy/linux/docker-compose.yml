# 星槎 · 编排。**一个文件、一个服务、一个容器。**
#
# 此前是三个 compose 文件（生产 / 局域网 / Windows）加两份 Caddyfile，外层再靠
# `.env` 里的 COMPOSE_FILE 把它们拼起来。收敛掉的理由很直接：那些差异全都是
# **同一个东西的参数**——监听哪个地址、哪个端口、数据放哪儿——而参数应该是变量，
# 不是文件。三份文件的真实代价是它们会各自漂移，且只在真的 `up` 时才暴露。
#
# **拓扑是一个开关：.env 里的 XINGCHA_GATEWAY。**
#
#   留空   这一份自己跑：发布宿主端口 8720，明文 HTTP。密码与 sk-xc- 密钥在网络上
#          裸传，而且那个端口走 DOCKER-USER 链、绕过 ufw——所以默认只绑回环。
#   edge   叠上 docker-compose.gateway.yml：端口被强制只绑 127.0.0.1（见 xc 的
#          derive_bind_addr），对外只有本机那个 Caddy 上的 HTTPS。
#          代价是**网关成了硬依赖**，它没起就完全进不去。
#
# 两条并存的风险是**它们的安全性质不同，而人只记得住能打开的那一个**，所以叠加层
# 用 `!override` 把 ports 整条清掉：挂上网关之后，直连那条入口不再存在。
#
# 用法一律走 ./xc（同目录），它替你把 -f 与 --env-file 传好，并在启动前检查网关
# 在不在：
#
#     ./deploy/linux/xc start        构建并启动，数据不动
#     ./deploy/linux/xc redeploy     清空数据从零开始
#
# **这份编排只服务 Linux**，所以它在 deploy/linux/ 下。Windows 走
# deploy/windows/xc.bat：不打镜像，uv 直接在宿主起进程——理由是 Docker Desktop
# 那条路上 data 不能放宿主目录（WAL 静默降级），绕开它要把数据塞进命名卷，
# 于是备份和体检都得进容器做。见 deploy/README.md。
#
# 网关自己怎么起见 deploy/edge/CADDY.md：本机上的一个 Caddy 容器，一条 docker run，
# 一台可以同时服务本机多个项目（根证书每台设备只装一次）。它不属于这份编排。

# 项目名写死。不写的话 compose 用 compose 文件所在目录名，也就是 "deploy"——
# 容器会叫 deploy-xingcha-1，而所有文档、脚本与运维记忆里都是 xingcha-xingcha-1。
name: xingcha

services:
  xingcha:
    build:
      # 相对路径以 **compose 文件所在目录** 为基准（这里是 deploy/linux/），
      # 所以 ../.. 才是仓库根 —— 这一层是脚本按系统分目录之后加的。
      context: ../..
      dockerfile: Dockerfile
    image: xingcha:local
    restart: unless-stopped

    # 宿主上绑哪个地址。**不是用户变量**——由 deploy/linux/xc 从 XINGCHA_WEB_HOST 推出来
    # 再导出（见那里的 derive_bind_addr）：localhost/127.0.0.1 → 只绑回环，
    # 其它 → 0.0.0.0。
    #
    # 合成一个变量是因为分开最容易出的错是二者对不上：显示局域网 IP、却只绑了回环，
    # 于是别人打不开而页面上的地址看起来完全正确。
    #
    # 默认值 127.0.0.1 是安全属性：映射出去的端口走 Docker 的 DOCKER-USER 链、
    # **绕过 ufw**，所以"开给局域网"必须是一次显式选择（把 WEB_HOST 填成真地址）。
    #
    # 挂网关时这一条**照旧存在**——网关是宿主进程（deploy/edge），它要从回环连进来。
    # 那时 XINGCHA_BIND_ADDR 被 xc 强制成 127.0.0.1，局域网上连不到。
    ports:
      - "${XINGCHA_BIND_ADDR:-127.0.0.1}:${XINGCHA_WEB_PORT:-8720}:8720"

    # 宿主的 .env 直接注进容器：后台密码（XINGCHA_ADMIN_PASSWORD）与各厂商的
    # key 变量（DEEPSEEK_API_KEY 之类，上游页会读它们）都从这里来。
    #
    # 注意这与命令行的 `--env-file` **不是一回事**，很容易踩：
    #   · `--env-file X` 只决定 compose 拿什么去插值 ${...}；
    #   · 这里的 `env_file:` 决定容器里真正有哪些环境变量。
    # 所以 `--env-file 别的文件` 不会改变容器读到的密码——它读的始终是仓库根的 .env。
    # 路径写死是有意的：唯一支持的入口是 deploy/linux/xc，而它只用仓库根的 .env。
    env_file:
      - ../../.env

    environment:
      # 这几项由编排决定，**排在 env_file 之后所以会覆盖它**——避免 .env 里
      # 不小心留了一行 XINGCHA_PORT 就把容器内的监听端口改掉。
      XINGCHA_DATA_DIR: /data
      XINGCHA_HOST: 0.0.0.0
      XINGCHA_PORT: "8720"
      # 后台里展示的 curl 示例用它。挂网关时叠加层会换成 https + 网关端口。
      XINGCHA_PUBLIC_URL: http://${XINGCHA_WEB_HOST:-localhost}:${XINGCHA_WEB_PORT:-8720}
      XINGCHA_LOG_LEVEL: ${XINGCHA_LOG_LEVEL:-INFO}


    volumes:
      # 默认宿主目录（../data，即仓库根下的 data/）。填卷名则改用命名卷。
      #
      # 只在宿主目录不适合放 SQLite 时才动它：网络文件系统上 **WAL 会静默降级**
      # ——症状是零星的 database is locked，只在并发写时出现，压不出来也难复现。
      # Docker Desktop 经 9p/virtiofs 挂进来的 Windows 目录就是这一类；但那条路
      # 已经不用了，Windows 上直接用 uv 本地跑（deploy/windows/xc.bat），不打镜像。
      - ${XINGCHA_DATA_MOUNT:-../../data}:/data

    # 30 秒是折中。设成和 request_timeout(600s) 一样长的话，每次升级要等 10 分钟；
    # 设成 0 的话，正在跑的调用会被硬切。已对齐的升级档位接受"长请求可能被切断"。
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        # 不限的话日志会涨满磁盘，而整个产品就是一个 SQLite 文件：磁盘一满就是
        # 写失败 + 迁移失败 + 无法启动，根因却在监控里完全看不见。这是准入项 A8。
        max-size: "20m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8720/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # 只有 XINGCHA_DATA_MOUNT=xingcha_data 时才会真的被创建。
  # 声明在这里但没人用的命名卷不会被创建，所以对默认的宿主目录部署没有任何副作用。
  xingcha_data:
