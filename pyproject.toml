[project]
name = "xingcha"
version = "1.0.0"
description = "自部署的 Agent 控制面：把提示词变成可调用、可计量、可带走的服务"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }

dependencies = [
  # Agent 内核。~= 锁到补丁位：AgentSpec 字段与 CAPABILITY_TYPES 会随版本演进，
  # 全部适配集中在 core/builder.py 一个文件。
  # [spec] extra 提供 YAML 支持，缺失会 ImportError。
  "pydantic-ai-slim[openai,spec]~=2.35.3",
  "fastapi>=0.135,<1.0",
  "uvicorn[standard]>=0.38",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  # T2 档的运行时校验。声明式路径不校验是本项目存在的理由，见开发计划 §2 H1。
  "jsonschema>=4.23",
  # jsonschema 的引用解析器。我们显式传空 Registry 禁止远程 $ref（准入项 A6）。
  "referencing>=0.35",
  "jinja2>=3.1",
  "typer>=0.27",
  "pydantic-settings>=2.14",
  "cryptography>=44",
  "argon2-cffi>=23",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  # 可观测。做成基础依赖而不是 extra：只多 ~7MB，而做成 extra 就意味着"想开 trace"
  # 要重建镜像——那和"升级对用户无感"是一个方向上的取舍，配置改一下就能开更好。
  # 只装 HTTP exporter，不装 grpc（后者会拖进 grpcio，几十 MB）。
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.scripts]
xingcha = "xingcha.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov",
  "ruff",
  "pyright",
  "playwright>=1.62.0",
  "pytest-playwright>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xingcha"]
# 模板、静态资源与迁移脚本必须进 wheel：后台要离线可用，迁移要能自动跑。
artifacts = [
  "src/xingcha/web/templates/*",
  "src/xingcha/web/static/*",
  "src/xingcha/db/migrations/**",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 把中文全角标点判为「歧义字符」。本项目的注释与文档字符串全是中文，
# 全角标点是正确写法，不是笔误。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# Depends / Query 放在参数默认值里是 FastAPI 的标准写法，不是 B008 想抓的可变默认值。
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  # 干净环境的导出验收要建 venv 装包，慢但必须真跑——它是「低锁定」的唯一证明。
  # 赶时间时用：pytest -m "not slow"
  "slow: 需要建虚拟环境或装包的测试",
  # 浏览器端到端：起真服务 + 开真 chromium。比其余测试慢一个数量级，但它是唯一能
  # 证明"页面在浏览器里真能用"的一层——CSP 挡掉内联脚本那次，ASGI 层的测试全绿。
  # 赶时间时用：pytest -m "not browser"
  "browser: 需要真浏览器（/usr/bin/chromium）的端到端测试",
  # 故意触发失败请求的用例用它豁免控制台断言（参数是允许出现的子串）。
  # 豁免必须逐条显式——把断言整体放宽会让所有用例失去这层保护。
  "expect_console_errors: 该用例预期出现的浏览器控制台错误（子串匹配）",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
