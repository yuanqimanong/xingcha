[project]
name = "xingcha"
version = "0.1.0.dev0"
description = "自部署的 Agent 控制面：把提示词变成可调用、可计量、可带走的服务"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }

dependencies = [
  # Agent 内核。~= 锁到补丁位：AgentSpec 字段与 CAPABILITY_TYPES 会随版本演进，
  # 全部适配集中在 core/builder.py 一个文件（见 docs/开发计划.md §6 标准 3）。
  # [spec] extra 提供 YAML 支持，缺失会 ImportError。
  "pydantic-ai-slim[openai,spec]~=2.35.3",
  "fastapi>=0.135,<1.0",
  "uvicorn[standard]>=0.38",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  # T2 档的运行时校验。声明式路径不校验是本项目存在的理由，见开发计划 §2 H1。
  "jsonschema>=4.23",
  # jsonschema 的引用解析器。我们显式传空 Registry 禁止远程 $ref（准入项 A6）。
  "referencing>=0.35",
  "jinja2>=3.1",
  "typer>=0.27",
  "pydantic-settings>=2.14",
  "cryptography>=44",
  "argon2-cffi>=23",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
]

[project.scripts]
xingcha = "xingcha.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov",
  "ruff",
  "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xingcha"]
# 模板、静态资源与迁移脚本必须进 wheel：后台要离线可用，迁移要能自动跑。
artifacts = [
  "src/xingcha/web/templates/*",
  "src/xingcha/web/static/*",
  "src/xingcha/db/migrations/**",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 把中文全角标点判为「歧义字符」。本项目的注释与文档字符串全是中文，
# 全角标点是正确写法，不是笔误。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# Depends / Query 放在参数默认值里是 FastAPI 的标准写法，不是 B008 想抓的可变默认值。
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  # 干净环境的导出验收要建 venv 装包，慢但必须真跑——它是「低锁定」的唯一证明。
  # 赶时间时用：pytest -m "not slow"
  "slow: 需要建虚拟环境或装包的测试",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
